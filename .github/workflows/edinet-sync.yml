name: EDINET sync

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: First filing date (YYYY-MM-DD); defaults to 7 days ago
        required: false
        type: string
      to_date:
        description: Last filing date (YYYY-MM-DD); defaults to today
        required: false
        type: string
      edinet_code:
        description: Optional four-digit Japanese security code
        required: false
        type: string
  schedule:
    # After the Japanese filing day, Monday through Friday.
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: edinet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement api/requirements.txt

      - name: Restore screener database and filing cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/graham-screener
          key: edinet-store-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            edinet-store-${{ runner.os }}-

      - name: Validate configuration
        run: |
          if [ -z "$EDINET_API_KEY" ]; then
            echo "EDINET_API_KEY is not configured in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Run EDINET tests
        working-directory: api
        run: >-
          python -m pytest -q
          tests/test_edinet.py
          tests/test_edinet_api.py
          tests/test_edinet_import.py
          tests/test_edinet_mapper.py
          tests/test_jpx.py
          tests/test_yahoo_japan.py

      - name: Resolve import range
        id: range
        env:
          INPUT_FROM: ${{ inputs.from_date }}
          INPUT_TO: ${{ inputs.to_date }}
          INPUT_CODE: ${{ inputs.edinet_code }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta

          today = date.today()
          start = os.environ.get("INPUT_FROM") or (today - timedelta(days=7)).isoformat()
          end = os.environ.get("INPUT_TO") or today.isoformat()
          code = os.environ.get("INPUT_CODE") or ""

          # Fail before making network requests when manual input is malformed.
          start_date = date.fromisoformat(start)
          end_date = date.fromisoformat(end)
          if end_date < start_date:
              raise SystemExit("to_date must be on or after from_date")
          if code and (len(code) != 4 or not code.isdigit()):
              raise SystemExit("edinet_code must be exactly four digits")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"from={start_date.isoformat()}", file=output)
              print(f"to={end_date.isoformat()}", file=output)
              print(f"code={code}", file=output)
          PY

      - name: Import EDINET annual filings
        working-directory: api
        env:
          FROM_DATE: ${{ steps.range.outputs.from }}
          TO_DATE: ${{ steps.range.outputs.to }}
          EDINET_CODE: ${{ steps.range.outputs.code }}
        run: |
          args=(edinet-import --from "$FROM_DATE" --to "$TO_DATE")
          if [ -n "$EDINET_CODE" ]; then
            args+=(--edinet-code "$EDINET_CODE")
          fi
          python -m screener.sync "${args[@]}"

      - name: Rebuild dashboard payload
        working-directory: api
        run: python -m screener.sync export

      - name: Upload dashboard payload
        uses: actions/upload-artifact@v4
        with:
          name: edinet-dashboard-${{ github.run_number }}
          path: api/screener/static/dashboard.json
          if-no-files-found: error
          retention-days: 30

      - name: Save screener database and filing cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/graham-screener
          key: edinet-store-${{ runner.os }}-${{ github.run_id }}
